<div class="redirect-container">
  <div class="redirect-card">
    
    <!-- Loading State -->
    @if (loading()) {
      <div class="status-content">
        <div class="logo-icon-wrapper">
          <svg class="logo-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>

        <div class="spinner-wrapper">
          <div class="spinner"></div>
        </div>

        <h1 class="card-title">Verifying Access Link</h1>
        <p class="card-desc">{{ statusMessage() }}</p>

        <div class="badge-status">
          <span class="badge-dot"></span>
          <span>Connecting securely</span>
        </div>
      </div>
    }

    <!-- Error State -->
    @if (!loading() && errorMessage()) {
      <div class="error-content">
        <div class="error-icon-wrapper">
          <svg class="error-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 8.25h.008v.008H12v-.008z" />
          </svg>
        </div>

        <h1 class="card-title">Access Link Unavailable</h1>
        <p class="card-desc">{{ errorMessage() }}</p>

        <a [routerLink]="fallbackLink()" class="btn-action">
          Go to Form
        </a>
      </div>
    }

  </div>
</div>
