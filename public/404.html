<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>DynamicForms AI — Enterprise Dynamic Form Platform</title>
    <!-- Open Graph / LinkedIn / Social Cards -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tankabhay.github.io/dynamic-forms-ui/">
    <meta property="og:title" content="DynamicForms AI — Enterprise Dynamic Form Platform">
    <meta property="og:description" content="AI-powered dynamic form builder, copilot, and submission engine built with modern Angular 22 and .NET 10.">
    <meta property="og:site_name" content="DynamicForms AI">
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
